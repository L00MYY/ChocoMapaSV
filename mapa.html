<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tours por El Salvador</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS de Mapbox GL JS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />

    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body class="mapa-body">
    <div class="app-layout">
        <!-- Barra de Navegación Superior Institucional -->
        <header class="navbar app-header">
            <div class="header-container">
                <!-- Logo institucional -->
                <a href="index.html" class="app-logo-container"
                    aria-label="Inicio - Ministerio de Turismo de El Salvador">
                    <img src="https://www.mitur.gob.sv/wp-content/uploads/2024/02/MITUR-Blanco-transparente.png"
                        class="app-logo" alt="Ministerio de Turismo de El Salvador" decoding="async"
                        fetchpriority="high">
                    <span class="header-title">Ministerio de Turismo</span>
                </a>

                <!-- Navegación Principal -->
                <nav class="header-navigation" aria-label="Navegación principal">
                    <a href="index.html" class="nav-link" id="nav-inicio">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Inicio</span>
                    </a>
                    <a href="mapa.html" class="nav-link active" id="nav-mapa" aria-current="page">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                            <line x1="8" y1="2" x2="8" y2="18"></line>
                            <line x1="16" y1="6" x2="16" y2="22"></line>
                        </svg>
                        <span>Mapa</span>
                    </a>
                    <a href="lugares-turisticos.html" class="nav-link" id="nav-lugares">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Lugares turísticos</span>
                    </a>
                    <a href="tours.html" class="nav-link" id="nav-tours">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                        </svg>
                        <span>Tours</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Franja Dedicada: Búsqueda y Filtros por Categoría -->
        <section class="search-filter-bar">
            <!-- Buscador de Lugares -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar lugares turísticos en El Salvador...">
                    <ul class="results-list hidden" id="results-list"></ul>
                </div>
            </div>

            <!-- Filtros por Categoría (Etiquetas tipo píldora) -->
            <div class="legend-box">
                <div class="legend-item"><span class="color-dot"></span> Históricos</div>
                <div class="legend-item"><span class="color-dot"></span> Restaurantes</div>
                <div class="legend-item"><span class="color-dot"></span> Miradores</div>
                <div class="legend-item"><span class="color-dot"></span> Tours</div>
            </div>
        </section>

        <!-- Contenedor Principal: Mapa y Tarjeta Flotante -->
        <section class="map-section">
            <!-- El Mapa -->
            <div id="map" class="map-container"></div>

            <!-- Tarjeta Flotante (Overlay) -->
            <div id="info-sidebar" class="info-sidebar hidden">
                <!-- Botón de Cerrar -->
                <button id="close-sidebar" class="close-btn">&times;</button>

                <!-- Contenedor donde se inyectarán los datos desde JS -->
                <div id="sidebar-content">
                    <div class="sidebar-placeholder">
                        <p>Selecciona un lugar en el mapa para ver sus detalles.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Pie de página institucional -->
        <footer class="app-footer">
            <div class="footer-container">
                <p class="footer-copy">
                    &copy; Ministerio de Turismo de El Salvador (MITUR) — Todos los derechos reservados.
                </p>
                <p class="footer-tagline">El Salvador • Tierra de Anfitriones</p>
            </div>
        </footer>
    </div>

    <!-- Script de Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>

    <!-- Tu Script Principal como Módulo -->
    <script type="module" src="js/controllers/MapaController.js"></script>
</body>

</html>
