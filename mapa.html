<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChocoMapaSV - Turismo en Santa Ana</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- CSS de Mapbox GL JS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- 1. Top Navigation Bar -->
        <header class="app-header">
            <div class="logo-placeholder"></div>
            <h1>ChocoMapaSV</h1>
        </header>

        <!-- 2. Search Container -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Busque una experiencia o sitio" autocomplete="off">
                <ul id="search-results" class="results-list hidden"></ul>
            </div>
        </div>

        <!-- 3. Map Container -->
        <div class="map-section">
            <div id="map" class="map-container"></div>
        </div>
    </div>

    <!-- Script de Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    
    <!-- Archivo principal de lógica -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
