<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tours por El Salvador</title>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS de Mapbox GL JS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Barra de Navegación Superior -->
        <header class="app-header">
            <!-- Logo con su recuadro oscuro gracias al CSS -->
            <img src="img/logo.png" class="app-logo" alt="Gobierno de El Salvador - Ministerio de Turismo">
            
            <!-- Barra de Búsqueda y Leyenda agrupadas a la derecha -->
            <section class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Buscar lugares turísticos en El Salvador...">
                        <ul class="results-list hidden" id="results-list"></ul>
                    </div>
                </div>
                
                <!-- Leyenda de Colores -->
                <div class="legend-box">
                    <div class="legend-item"><span class="color-dot" style="background-color: #4ECDC4;"></span> Históricos</div>
                    <div class="legend-item"><span class="color-dot" style="background-color: #FFA07A;"></span> Restaurantes</div>
                    <div class="legend-item"><span class="color-dot" style="background-color: #88D49E;"></span> Miradores</div>
                    <div class="legend-item"><span class="color-dot" style="background-color: #FFD166;"></span> Tours</div>
                    <div class="legend-item"><span class="color-dot" style="background-color: #FF6B6B;"></span> Otros</div>
                </div>
            </section>
        </header>

        <!-- Contenedor Principal: Mapa y Tarjeta Flotante -->
        <section class="map-section">
            <!-- El Mapa -->
            <div id="map" class="map-container"></div>
            
            <!-- Tarjeta Flotante (Overlay) -->
            <div id="info-sidebar" class="info-sidebar hidden">
                <!-- Botón de Cerrar -->
                <button id="close-sidebar" class="close-btn">&times;</button>
                
                <!-- Contenedor donde se inyectarán los datos desde JS -->
                <div id="sidebar-content">
                    <div class="sidebar-placeholder">
                        <p>Selecciona un lugar en el mapa para ver sus detalles.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Script de Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    
    <!-- Tu Script Principal como Módulo -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
