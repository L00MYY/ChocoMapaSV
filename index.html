<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministerio de turismo SV</title>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css?family=Caacupe+One&family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos globales -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/index-style.css">
</head>
<body>
    <!-- Barra de Navegación Institucional Estandarizada -->
    <header class="app-header">
        <div class="header-container">
            <a href="mapa.html" class="app-logo-container" aria-label="Inicio - Ministerio de Turismo de El Salvador">
                <img src="https://www.mitur.gob.sv/wp-content/uploads/2024/02/MITUR-Blanco-transparente.png" class="app-logo" alt="Ministerio de Turismo de El Salvador" decoding="async" fetchpriority="high">
                <h1 class="header-title">Ministerio de Turismo</h1>
            </a>
            <nav class="header-navigation" aria-label="Navegación principal">
                <a href="mapa.html" class="nav-link" id="nav-mapa">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                    <span>Mapa</span>
                </a>
                <a href="lugares-turisticos.html" class="nav-link" id="nav-lugares">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Lugares turísticos</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Bienvenida -->
    <main class="hero-wrapper">
        <section class="hero-content">
            <span class="hero-eyebrow">Bienvenido a ChocoMapaSV</span>
            <h2 class="hero-title">Explora El Salvador <em>a tu ritmo</em></h2>
            <p class="hero-description">
                Descubre rutas, miradores y tours en un solo mapa interactivo. Busca tu próximo destino y planifica tu visita de manera fácil.
            </p>
            
            <!-- Botón -->
            <a href="mapa.html" class="btn-primary">
                Abrir el mapa
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </section>
    </main>
</body>
</html>
